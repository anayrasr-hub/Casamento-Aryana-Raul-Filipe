<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Confirmar Presença - Aryana & Raul Filipe
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/confirmacao.css"
    >

</head>

<body>

<header class="topo-confirmacao">

    <h1>
        CONFIRME SUA PRESENÇA
    </h1>

    <h2>
        Aryana & Raul Filipe
    </h2>

    <p>
        11 de Outubro de 2026 às 09:00
    </p>

</header>


<main class="pagina-confirmacao">

    <button
        type="button"
        id="btnVoltarConfirmacao"
        class="btn-voltar-confirmacao"
    >
        ← Voltar
    </button>


    <!-- FOTO DO CASAL -->

    <img
        src="imagens/casal.jpg"
        class="foto-casal-confirmacao"
        alt="Aryana e Raul Filipe"
    >


    <section class="card-confirmacao">

        <div class="titulo-formulario">

            <h2>
                Confirme sua presença
            </h2>

            <p>
                Preencha os dados de cada convidado.
            </p>

        </div>


        <!-- =========================================
             FORMULÁRIO
        ========================================== -->
<div class="aviso-crianca">

    <strong>OBS:</strong>
    Confirmar os dados de <strong>CRIANÇA</strong>
    somente a partir de 07 (sete) anos de idade.

</div>

        <form id="formPresenca">

            <div id="listaConvidadosFormulario">


                <!-- =================================
                     CONVIDADO 1
                ================================== -->

                <div
                    class="bloco-convidado"
                    data-convidado="1"
                >

                    <div class="cabecalho-convidado">

                        <h3>
                            Convidado 1
                        </h3>

                    </div>


                    <label>
                        Nome completo
                    </label>

                    <input
                        type="text"
                        class="campo-nome"
                        placeholder="Digite o nome completo"
                    >


                    <label>
                        Tipo de convidado
                    </label>

                    <select
                        class="campo-tipo"
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="Adulto">
                            Adulto
                        </option>

                        <option value="Crianca">
                            Criança
                        </option>

                    </select>


                    <!-- IDADE -->

                    <div
                        class="campo-idade-container"
                        style="display:none;"
                    >

                        <label>
                            Idade da criança
                        </label>

                        <input
                            type="number"
                            class="campo-idade"
                            min="0"
                            max="17"
                        >

                    </div>


                    <!-- SEXO -->

                    <label>
                        Sexo <span>(opcional)</span>
                    </label>

                    <select
                        class="campo-sexo"
                    >

                        <option value="">
                            Não informar
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                    </select>


                    <!-- CALÇADO -->

                    <div
                        class="campo-calcado-container"
                        style="display:none;"
                    >

                        <label>
                            Número do calçado
                        </label>

                        <input
                            type="number"
                            class="campo-calcado"
                            min="20"
                            max="50"
                        >

                    </div>


                    <!-- WHATSAPP -->

                    <label>
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        class="campo-whatsapp"
                        placeholder="(21) 99999-9999"
                    >

                </div>

            </div>


            <!-- =========================================
                 BOTÃO ADICIONAR
            ========================================== -->

            <button
                type="button"
                id="btnAdicionarConvidado"
                class="btn-adicionar-convidado"
            >
                + Adicionar outro convidado
            </button>


            <!-- =========================================
                 CONFIRMAR
            ========================================== -->

            <button
                type="submit"
                class="btn-confirmar-presenca"
            >
                Confirmar presença
            </button>

        </form>


        <!-- RESULTADO -->

        <div
            id="listaConvidados"
            class="resultado-confirmacao"
        ></div>

    </section>

</main>


<!-- =========================================
     FIREBASE
========================================== -->

<script
    type="module"
    src="js/firebase-service.js"
></script>


<!-- =========================================
     CONFIRMAÇÃO
========================================== -->

<script
    type="module"
    src="js/confirmacao.js?v=20260814-02"
></script>

</body>

</html>
