<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Confirmar Presença - Aryana & Raul Filipe
</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="stylesheet"
    href="css/confirmacao.css"
>

</head>

<body>

<header class="topo-confirmacao">

    <h1>
        CONFIRME SUA PRESENÇA
    </h1>

    <h2>
        Aryana & Raul Filipe
    </h2>

    <p>
        11 de Outubro de 2026 às 09:00
    </p>

</header>


<main class="pagina-confirmacao">

    <button
        type="button"
        id="btnVoltarConfirmacao"
        class="btn-voltar-confirmacao"
    >
        ← Voltar
    </button>


    <!-- UMA ÚNICA FOTO -->

    <img
        src="imagens/casal.jpg"
        class="foto-casal-confirmacao"
        alt="Aryana e Raul Filipe"
    >


    <section class="card-confirmacao">

        <div class="titulo-formulario">

            <h2>
                Confirme sua presença
            </h2>

            <p>
                Preencha os dados de cada convidado.
            </p>

        </div>


        <form id="formPresenca">


            <div id="listaConvidados">


                <!-- CONVIDADO 1 -->

                <div
                    class="convidado-bloco"
                    data-convidado="1"
                >

                    <div class="numero-convidado">
                        Convidado 1
                    </div>


                    <label>
                        Nome completo
                    </label>

                    <input
                        type="text"
                        name="nome"
                        required
                        autocomplete="name"
                        placeholder="Digite o nome completo"
                    >


                    <label>
                        Tipo de convidado
                    </label>

                    <select
                        name="tipo"
                        class="campo-tipo"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="Adulto">
                            Adulto
                        </option>

                        <option value="Crianca">
                            Criança
                        </option>

                    </select>


                    <div
                        class="campo-idade"
                        style="display:none;"
                    >

                        <label>
                            Idade
                        </label>

                        <input
                            type="number"
                            name="idade"
                            min="0"
                            max="17"
                            placeholder="Idade da criança"
                        >

                    </div>


                    <label>
                        Sexo
                        <span class="opcional">
                            (opcional)
                        </span>
                    </label>

                    <select name="sexo">

                        <option value="">
                            Não informar
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                    </select>


                    <div
                        class="campo-calcado"
                        style="display:none;"
                    >

                        <label>
                            Número do calçado
                            <span class="opcional">
                                (opcional)
                            </span>
                        </label>

                        <input
                            type="number"
                            name="calcado"
                            min="20"
                            max="50"
                            placeholder="Ex.: 37"
                        >

                    </div>


                    <label>
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        name="whatsapp"
                        required
                        autocomplete="tel"
                        placeholder="(21) 99999-9999"
                    >

                </div>

            </div>


            <button
                type="button"
                id="btnAdicionarConvidado"
                class="btn-adicionar-convidado"
            >
                + Adicionar outro convidado
            </button>


            <button
                type="submit"
                id="btnConfirmarPresenca"
                class="btn-confirmar-presenca"
            >
                Confirmar presença
            </button>


            <div
                id="mensagemConfirmacao"
                class="mensagem-confirmacao"
            ></div>


        </form>


        <div
            id="resultadoConfirmacao"
            class="resultado-confirmacao"
            style="display:none;"
        ></div>

    </section>

</main>


<!-- FIREBASE -->

<script
    type="module"
    src="js/firebase-service.js"
></script>


<!-- CONFIRMAÇÃO -->

<script
    type="module"
    src="js/confirmacao.js"
></script>

</body>

</html>
