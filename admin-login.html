<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administração | Aryana & Raul Filipe
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body class="pagina-login-admin">


    <main class="login-admin">


        <div class="login-card">


            <div class="login-logo">

                ❤️

            </div>


            <h1>

                Aryana & Raul Filipe

            </h1>


            <p class="login-subtitulo">

                Área administrativa

            </p>


            <form
                id="formLoginAdmin"
            >


                <div class="campo-login">

                    <label for="emailAdmin">

                        E-mail

                    </label>


                    <input
                        type="email"
                        id="emailAdmin"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo-login">

                    <label for="senhaAdmin">

                        Senha

                    </label>


                    <input
                        type="password"
                        id="senhaAdmin"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnLoginAdmin"
                    class="btn-login-admin"
                >

                    Entrar

                </button>


                <div
                    id="mensagemLoginAdmin"
                    class="mensagem-login-admin"
                ></div>


            </form>


        </div>


    </main>


    <script
        type="module"
        src="js/admin-login.js"
    ></script>


</body>

</html>
