<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Área Administrativa | Aryana & Raul Filipe
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body class="pagina-login-admin">


    <main class="login-admin-container">


        <section class="login-admin-card">


            <div class="login-admin-coracao">
                ❤️
            </div>


            <h1>
                Aryana & Raul Filipe
            </h1>


            <div class="login-admin-linha">
            </div>


            <h2>
                Área Administrativa
            </h2>


            <p class="login-admin-subtitulo">

                Acesso exclusivo aos
                administradores do casamento.

            </p>


            <form id="formLoginAdmin">


                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="username"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        id="senha"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnEntrarAdmin"
                    class="btn-login-admin"
                >

                    Entrar

                </button>


                <div
                    id="erroLogin"
                    class="erro-login-admin"
                >
                </div>


            </form>


            <a
                href="index.html"
                class="voltar-site-admin"
            >

                ← Voltar para o site

            </a>


        </section>


    </main>


    <script
        type="module"
        src="js/admin-login.js"
    >
    </script>


</body>

</html>
