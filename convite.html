<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Convite - Aryana & Raul Filipe
    </title>

    <style>

        :root {
            --terracota: #b85c38;
            --terracota-dark: #8f432d;
            --fundo: #f7ede7;
            --creme: #fffaf6;
            --borda: #e7c7b8;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                var(--fundo);

            color:
                #5f3428;

            font-family:
                Arial,
                sans-serif;

        }


        .pagina-convite {

            width:
                min(92%, 600px);

            margin:
                25px auto 40px;

        }


        .convite {

            background:
                var(--creme);

            border:
                1px solid
                var(--borda);

            border-radius:
                22px;

            overflow:
                hidden;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.12);

        }


        .cabecalho {

            background:
                var(--terracota);

            color:
                white;

            text-align:
                center;

            padding:
                28px 20px;

        }


        .cabecalho h1 {

            margin:
                0 0 8px;

            font-family:
                Georgia,
                serif;

            font-size:
                1.8rem;

        }


        .cabecalho p {

            margin:
                4px 0;

            font-size:
                .9rem;

        }


        .foto {

            display:
                block;

            width:
                100%;

            height:
                300px;

            object-fit:
                cover;

        }


        .conteudo {

            padding:
                28px 22px;

            text-align:
                center;

        }


        .saudacao {

            font-family:
                Georgia,
                serif;

            color:
                var(--terracota-dark);

            font-size:
                1.5rem;

            margin:
                0 0 10px;

        }


        .mensagem {

            font-size:
                .95rem;

            line-height:
                1.6;

            margin:
                0 0 22px;

        }


        .codigo-area {

            background:
                #f6e6dd;

            border:
                1px solid
                var(--borda);

            border-radius:
                14px;

            padding:
                18px;

            margin:
                20px 0;

        }


        .codigo-label {

            display:
                block;

            margin-bottom:
                8px;

            font-size:
                .8rem;

            font-weight:
                700;

            color:
                var(--terracota-dark);

        }


        .codigo {

            display:
                inline-block;

            padding:
                10px 18px;

            background:
                white;

            border:
                1px solid
                var(--terracota);

            border-radius:
                9px;

            color:
                var(--terracota-dark);

            font-size:
                1.3rem;

            font-weight:
                800;

            letter-spacing:
                2px;

        }


        .informacao {

            margin:
                20px 0;

            font-size:
                .9rem;

            line-height:
                1.6;

        }


        .rodape {

            border-top:
                1px solid
                var(--borda);

            padding:
                20px;

            text-align:
                center;

            font-family:
                Georgia,
                serif;

            color:
                var(--terracota-dark);

        }


        .carregando {

            padding:
                40px 20px;

            text-align:
                center;

        }


        .erro {

            margin:
                30px auto;

            padding:
                22px;

            background:
                #fdecea;

            border:
                1px solid
                #e4b5ae;

            border-radius:
                14px;

            text-align:
                center;

            color:
                #8f3027;

        }


        @media (
            max-width: 600px
        ) {

            .pagina-convite {

                width:
                    calc(100% - 20px);

                margin:
                    10px auto 25px;

            }


            .cabecalho {

                padding:
                    22px 15px;

            }


            .cabecalho h1 {

                font-size:
                    1.5rem;

            }


            .foto {

                height:
                    230px;

            }


            .conteudo {

                padding:
                    24px 16px;

            }


            .codigo {

                font-size:
                    1.1rem;

            }

        }

    </style>

</head>


<body>


<main class="pagina-convite">

    <div
        id="app"
        class="convite"
    >

        <div class="carregando">

            Carregando seu convite... ❤️

        </div>

    </div>

</main>


<script type="module">

    /*
    ==========================================
    GOOGLE SHEETS
    ==========================================
    */

    const GOOGLE_SHEETS_URL =
        "https://script.google.com/macros/s/AKfycbwxoY3KVrIxOjRvZ8nWJOhwA3dWoK_OVnR3Wj893rZLONMIhIpE_TrOFaRLsmm41q1Q/exec";


    /*
    ==========================================
    ELEMENTO
    ==========================================
    */

    const app =
        document.getElementById(
            "app"
        );


    /*
    ==========================================
    PEGAR CÓDIGO DA URL
    ==========================================
    */

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const codigo =
        parametros.get(
            "codigo"
        );


    /*
    ==========================================
    ESCAPAR HTML
    ==========================================
    */

    function escaparHTML(
        texto
    ) {

        return String(
            texto ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    /*
    ==========================================
    CARREGAR CONVIDADO
    ==========================================
    */

    async function carregarConvite() {

        if (!codigo) {

            mostrarErro(
                "Código do convite não informado."
            );

            return;

        }


        try {

            console.log(
                "Buscando convite:",
                codigo
            );


            const resposta =
                await fetch(
                    GOOGLE_SHEETS_URL +
                    "?acao=listarConvidados",
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );


            if (!resposta.ok) {

                throw new Error(
                    "Erro HTTP " +
                    resposta.status
                );

            }


            const resultado =
                await resposta.json();


            console.log(
                "Convidados recebidos:",
                resultado
            );


            if (
                !resultado ||
                resultado.sucesso !== true
            ) {

                throw new Error(
                    resultado?.erro ||
                    resultado?.mensagem ||
                    "Não foi possível consultar os convidados."
                );

            }


            const convidados =
                Array.isArray(
                    resultado.convidados
                )
                    ? resultado.convidados
                    : [];


            const convidado =
                convidados.find(
                    function (item) {

                        return String(
                            item.codigo || ""
                        ).trim() ===
                        String(
                            codigo
                        ).trim();

                    }
                );


            if (!convidado) {

                mostrarErro(
                    "Não encontramos um convidado com este código."
                );

                return;

            }


            mostrarConvite(
                convidado
            );


        } catch (erro) {

            console.error(
                "Erro ao carregar convite:",
                erro
            );


            mostrarErro(
                "Não foi possível carregar seu convite."
            );

        }

    }


    /*
    ==========================================
    MOSTRAR CONVITE
    ==========================================
    */

    function mostrarConvite(
        convidado
    ) {

        const nome =
            escaparHTML(
                convidado.nome
            );


        const codigoConvidado =
            escaparHTML(
                convidado.codigo
            );


        app.innerHTML = `

            <header class="cabecalho">

                <h1>
                    Aryana & Raul Filipe
                </h1>

                <p>
                    Nosso casamento
                </p>

                <p>
                    11 de Outubro de 2026 às 09:00
                </p>

            </header>


            <img
                src="imagens/casal.jpg"
                class="foto"
                alt="Aryana e Raul Filipe"
                onerror="this.style.display='none';"
            >


            <section class="conteudo">

                <h2 class="saudacao">

                    Olá, ${nome}! ❤️

                </h2>


                <p class="mensagem">

                    Sua presença no nosso casamento
                    foi confirmada com sucesso!

                    <br><br>

                    Estamos muito felizes em poder
                    celebrar esse momento especial
                    ao seu lado.

                </p>


                <div class="codigo-area">

                    <span class="codigo-label">

                        SEU CÓDIGO DO CONVITE

                    </span>


                    <span class="codigo">

                        ${codigoConvidado}

                    </span>

                </div>


                <p class="informacao">

                    Guarde este código.
                    Ele identifica individualmente
                    o seu convite.

                </p>

            </section>


            <footer class="rodape">

                Com carinho,<br>

                <strong>
                    Aryana & Raul Filipe
                </strong>

                <br><br>

                ❤️

            </footer>

        `;

    }


    /*
    ==========================================
    ERRO
    ==========================================
    */

    function mostrarErro(
        mensagem
    ) {

        app.innerHTML = `

            <div class="erro">

                <h2>
                    Ops! ❤️
                </h2>

                <p>
                    ${escaparHTML(
                        mensagem
                    )}
                </p>

                <p>
                    Verifique o código do convite
                    e tente novamente.
                </p>

            </div>

        `;

    }


    /*
    ==========================================
    INICIAR
    ==========================================
    */

    carregarConvite();

</script>


</body>

</html>
